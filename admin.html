<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Админ-панель</title>
    <style>
        :root {
            --bg: #f0ece6; --card: #faf8f5; --text: #3a3632; --text-muted: #8a827a;
            --primary: #6b6259; --primary-soft: #d6cec4; --border: #e0d9d0;
            --danger: #b85c5c; --warning: #c9a05a; --success: #6b8e6b;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; background: var(--bg); color: var(--text); padding-bottom: 70px; }

        #login-box { text-align: center; padding: 80px 20px; max-width: 400px; margin: 0 auto; }
        #login-box h1 { font-weight: 500; font-size: 22px; margin-bottom: 24px; }
        #login-box input { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 12px; font-size: 15px; background: var(--card); margin-bottom: 12px; box-sizing: border-box; }
        #login-box button { width: 100%; padding: 14px; border: none; border-radius: 12px; background: var(--primary); color: var(--card); font-size: 15px; font-weight: 500; cursor: pointer; }

        #panel { display: none; }
        .header { padding: 18px 20px 10px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { margin: 0; font-size: 22px; font-weight: 500; letter-spacing: 0.5px; }
        .live-badge { display: inline-block; background: var(--success); color: white; padding: 3px 8px; border-radius: 10px; font-size: 10px; margin-left: 6px; vertical-align: middle; }

        .container { padding: 0 20px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .order-card { background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 12px; border-left: 3px solid var(--border); }
        .order-card.new { border-left-color: var(--danger); animation: flash 2s; }
        @keyframes flash { 0%,100% { background: var(--card); } 50% { background: #f5ebe6; } }
        .order-card h3 { margin: 0 0 6px; font-size: 15px; font-weight: 600; }
        .order-card .meta { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; line-height: 1.4; }
        .order-card .items { font-size: 13px; margin-bottom: 10px; line-height: 1.6; color: var(--text); }
        .order-card .total { font-weight: 600; font-size: 15px; margin-bottom: 10px; color: var(--primary); }
        .order-card .status-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
        .status-badge { padding: 4px 10px; border-radius: 10px; font-size: 11px; color: white; font-weight: 500; }
        .status-new { background: var(--danger); }
        .status-work { background: var(--warning); }
        .status-done { background: var(--success); }
        .order-actions { display: flex; gap: 8px; margin-top: 4px; }
        .btn-small { padding: 8px 12px; border: 1px solid var(--border); background: transparent; border-radius: 10px; font-size: 12px; cursor: pointer; color: var(--text); }
        .btn-small:hover { background: var(--bg); }

        .product-row { background: var(--card); border-radius: 12px; padding: 12px; margin-bottom: 10px; display: flex; gap: 12px; align-items: center; }
        .product-row img { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; background: #e8e2da; flex-shrink: 0; }
        .product-row .info { flex: 1; min-width: 0; }
        .product-row .info h3 { margin: 0 0 3px; font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .product-row .info .meta { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
        .product-row .info .price { font-weight: 600; color: var(--primary); font-size: 14px; }
        .product-row .actions { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
        .product-row .actions button { padding: 6px 10px; border-radius: 8px; font-size: 11px; cursor: pointer; border: none; }
        .btn-edit { background: var(--primary-soft); color: var(--text); }
        .btn-del { background: #ecd5d5; color: var(--danger); }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group input, .form-group textarea { width: 100%; padding: 13px; border: 1px solid var(--border); border-radius: 12px; font-size: 14px; background: var(--card); color: var(--text); font-family: inherit; }
        .form-group textarea { resize: vertical; min-height: 60px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        @media (max-width: 500px) { .form-row { grid-template-columns: 1fr; } }

        .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 15px; font-weight: 500; cursor: pointer; }
        .btn-primary { background: var(--primary); color: var(--card); }
        .btn-secondary { background: var(--border); color: var(--text); }
        .status-msg { font-size: 13px; margin-top: 8px; }

        .filter-row { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
        .filter-row select { padding: 8px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; background: var(--card); color: var(--text); }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); z-index: 50; }
        .nav-item { display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-muted); padding: 6px 20px; border-radius: 12px; transition: 0.2s; position: relative; }
        .nav-item.active { color: var(--primary); }
        .nav-item svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
        .nav-badge { background: var(--danger); color: white; border-radius: 50%; padding: 1px 5px; font-size: 10px; position: absolute; top: 0; right: 12px; font-weight: 600; }

        .empty { text-align: center; color: var(--text-muted); padding: 40px 0; font-size: 14px; }

        .upload-btn { background: var(--primary-soft); color: var(--text); padding: 12px; border-radius: 12px; border: none; font-size: 14px; cursor: pointer; width: 100%; }
        .preview-imgs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
        .preview-imgs .img-wrap { position: relative; }
        .preview-imgs img { width: 70px; height: 70px; object-fit: cover; border-radius: 8px; }
        .preview-imgs .del-img { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; background: var(--danger); color: white; border: none; font-size: 12px; line-height: 1; cursor: pointer; padding: 0; }
        .hint { font-size: 11px; color: var(--text-muted); margin-top: 6px; }
    </style>
</head>
<body>

<div id="login-box">
    <h1>Админ-панель</h1>
    <input type="password" id="password" placeholder="Пароль">
    <button onclick="checkPassword()">Войти</button>
    <div id="login-status" style="color:var(--danger); margin-top:12px; font-size:13px;"></div>
</div>

<div id="panel">
    <div class="header">
        <h1 id="page-title">Заказы</h1>
        <span class="live-badge" id="live-badge" style="display:none;">LIVE</span>
    </div>

    <div id="tab-orders" class="tab-content active container">
        <div class="filter-row">
            <select id="order-filter" onchange="renderOrders()">
                <option value="">Все заказы</option>
                <option value="new">Новые</option>
                <option value="work">В работе</option>
                <option value="done">Выполненные</option>
            </select>
        </div>
        <div id="orders-list"></div>
    </div>

    <div id="tab-products" class="tab-content container">
        <div id="products-list"></div>
    </div>

    <div id="tab-add" class="tab-content container">
        <h2 id="form-title" style="font-size:17px; font-weight:500; margin: 0 0 16px;">Новый товар</h2>
        <div class="form-group">
            <label>Название</label>
            <input type="text" id="f-name" placeholder="Например: Свитер">
        </div>
        <div class="form-group">
            <label>Описание</label>
            <textarea id="f-desc" placeholder="Материал, особенности..."></textarea>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Цена (₽)</label>
                <input type="number" id="f-price" placeholder="4900">
            </div>
            <div class="form-group">
                <label>Категория</label>
                <input type="text" id="f-category" placeholder="Свитеры">
            </div>
        </div>
        <div class="form-group">
            <label>Размеры (через запятую)</label>
            <input type="text" id="f-sizes" placeholder="S, M, L, XL">
        </div>

        <div class="form-group">
            <label>Фотографии (до 3 шт., сжимаются автоматически)</label>
            <input type="file" id="photo-input" accept="image/*" multiple style="display:none;" onchange="handlePhotoSelect(event)">
            <button type="button" class="upload-btn" onclick="document.getElementById('photo-input').click()">📷 Выбрать фото с телефона</button>
            <div class="preview-imgs" id="preview-imgs"></div>
            <div class="hint" id="photo-hint">Каждое фото сжимается до ~300 КБ. Если фото уже было — оно заменится.</div>
        </div>

        <div id="form-status" class="status-msg"></div>
        <div style="display:flex; gap:10px; margin-top: 16px;">
            <button class="btn btn-primary" onclick="saveProduct()">Сохранить</button>
            <button class="btn btn-secondary" id="cancel-edit-btn" style="display:none;" onclick="cancelEdit()">Отмена</button>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" id="nav-orders" onclick="switchTab('orders')" style="position:relative;">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
            <span class="nav-badge" id="orders-badge" style="display:none;">0</span>
        </div>
        <div class="nav-item" id="nav-products" onclick="switchTab('products')">
            <svg viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>
        </div>
        <div class="nav-item" id="nav-add" onclick="switchTab('add')">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </div>
    </div>
</div>

<script type="module">
    const firebaseConfig = {
        apiKey: "AIzaSyAtmwSKze_P9F_4Wkd5ZPD45bGNmDXEQ58",
        authDomain: "my-shop-22c14.firebaseapp.com",
        projectId: "my-shop-22c14",
        storageBucket: "my-shop-22c14.firebasestorage.app",
        messagingSenderId: "1029158788389",
        appId: "1:1029158788389:web:01bfc85675c52ae315cecc"
    };

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const ADMIN_PASSWORD = "arhip2026";

    let allProducts = [];
    let allOrders = [];
    let editingId = null;
    let currentImages = []; // base64 или старые URL при редактировании
    let knownOrderIds = new Set();
    let firstOrdersLoad = true;
    let unsubOrders = null;
    let unsubProducts = null;

    // ==== СЖАТИЕ ФОТО ====
    // Читает файл, рисует на canvas, сжимает до maxSide px и возвращает base64 JPEG
    function compressImage(file, maxSide = 900, quality = 0.75) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    let { width, height } = img;
                    if (width > height && width > maxSide) {
                        height = Math.round(height * maxSide / width);
                        width = maxSide;
                    } else if (height > maxSide) {
                        width = Math.round(width * maxSide / height);
                        height = maxSide;
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const base64 = canvas.toDataURL('image/jpeg', quality);
                    resolve(base64);
                };
                img.onerror = reject;
                img.src = e.target.result;
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    window.handlePhotoSelect = async function(event) {
        const files = Array.from(event.target.files);
        if (!files.length) return;
        const hint = document.getElementById('photo-hint');
        const MAX_PHOTOS = 3;

        // Ограничение по количеству
        if (currentImages.length + files.length > MAX_PHOTOS) {
            alert(`Можно не больше ${MAX_PHOTOS} фото на товар. Сейчас уже ${currentImages.length}.`);
            event.target.value = '';
            return;
        }

        hint.innerText = 'Сжимаем фото...';
        for (const file of files) {
            try {
                const base64 = await compressImage(file);
                const sizeKb = Math.round(base64.length / 1024);
                if (sizeKb > 600) {
                    alert('Фото слишком большое даже после сжатия. Попробуйте другое.');
                    continue;
                }
                currentImages.push(base64);
            } catch (err) {
                alert('Не удалось обработать фото: ' + err.message);
            }
        }
        event.target.value = '';
        hint.innerText = 'Каждое фото сжимается до ~300 КБ. Нажмите на крестик, чтобы удалить фото.';
        renderPreviewImages();
    };

    function renderPreviewImages() {
        const container = document.getElementById('preview-imgs');
        container.innerHTML = currentImages.map((src, idx) => `
            <div class="img-wrap">
                <img src="${src}">
                <button class="del-img" onclick="removeImage(${idx})">×</button>
            </div>
        `).join('');
    }

    window.removeImage = function(idx) {
        currentImages.splice(idx, 1);
        renderPreviewImages();
    };

    // ==== ВХОД ====
    window.checkPassword = function() {
        if (document.getElementById('password').value === ADMIN_PASSWORD) {
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('panel').style.display = 'block';
            localStorage.setItem('admin_ok', '1');
            startListening();
        } else {
            document.getElementById('login-status').innerText = 'Неверный пароль';
        }
    };

    if (localStorage.getItem('admin_ok') === '1') {
        document.getElementById('login-box').style.display = 'none';
        document.getElementById('panel').style.display = 'block';
        startListening();
    }

    window.switchTab = function(name) {
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        document.getElementById('nav-' + name).classList.add('active');
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.getElementById('tab-' + name).classList.add('active');
        const titles = { orders: 'Заказы', products: 'Товары', add: editingId ? 'Редактирование' : 'Новый товар' };
        document.getElementById('page-title').innerText = titles[name];
        document.getElementById('live-badge').style.display = (name === 'orders' && !firstOrdersLoad) ? 'inline-block' : 'none';
    };

    function startListening() {
        if (!unsubOrders) {
            unsubOrders = onSnapshot(collection(db, "orders"), (snap) => {
                allOrders = [];
                let newOnes = 0;
                snap.forEach(d => {
                    const data = { id: d.id, ...d.data() };
                    allOrders.push(data);
                    if (!knownOrderIds.has(d.id)) {
                        knownOrderIds.add(d.id);
                        if (!firstOrdersLoad) newOnes++;
                    }
                });
                allOrders.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                const newCount = allOrders.filter(o => o.status === 'new').length;
                const badge = document.getElementById('orders-badge');
                if (newCount > 0) { badge.style.display = 'block'; badge.innerText = newCount; }
                else { badge.style.display = 'none'; }
                if (newOnes > 0) document.title = `(${newCount}) Админка`;
                firstOrdersLoad = false;
                renderOrders(newOnes > 0 ? allOrders[0].id : null);
            }, (err) => {
                document.getElementById('orders-list').innerHTML = '<p style="color:var(--danger);">Ошибка: ' + err.message + '</p>';
            });
        }
        if (!unsubProducts) {
            unsubProducts = onSnapshot(collection(db, "products"), (snap) => {
                allProducts = [];
                snap.forEach(d => {
                    const p = d.data();
                    let images = p.images;
                    if (!images || !Array.isArray(images) || images.length === 0) {
                        // совместимость со старыми полями
                        if (p.imageUrls && Array.isArray(p.imageUrls) && p.imageUrls.length) images = p.imageUrls;
                        else if (p.imageUrl) images = [p.imageUrl];
                        else images = [];
                    }
                    allProducts.push({
                        id: d.id, name: p.name || '', description: p.description || '',
                        price: p.price || 0, category: p.category || 'Без категории',
                        sizes: p.sizes || [], images
                    });
                });
                allProducts.sort((a, b) => a.name.localeCompare(b.name));
                renderProducts();
            });
        }
    }

    window.renderOrders = function(highlightId) {
        const filter = document.getElementById('order-filter').value;
        const container = document.getElementById('orders-list');
        const filtered = allOrders.filter(o => !filter || o.status === filter);
        if (filtered.length === 0) { container.innerHTML = '<div class="empty">Заказов нет</div>'; return; }
        container.innerHTML = '';
        filtered.forEach(o => {
            const div = document.createElement('div');
            div.className = 'order-card' + (o.id === highlightId ? ' new' : '');
            const badgeClass = o.status === 'new' ? 'status-new' : o.status === 'work' ? 'status-work' : 'status-done';
            const badgeText = o.status === 'new' ? 'Новый' : o.status === 'work' ? 'В работе' : 'Выполнен';
            const date = o.createdAt?.seconds ? new Date(o.createdAt.seconds * 1000).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
            const itemsHtml = (o.items || []).map(i => {
                let line = `• ${i.name}`;
                if (i.size) line += ` (${i.size})`;
                if (i.qty > 1) line += ` ×${i.qty}`;
                line += ` — ${i.price * (i.qty || 1)} ₽`;
                return line;
            }).join('<br>');
            div.innerHTML = `
                <h3>${o.customerName || 'Без имени'}</h3>
                <div class="meta">${o.customerPhone || ''}${o.customerTelegram ? ' • ' + o.customerTelegram : ''}<br>${date}</div>
                <div class="items">${itemsHtml}</div>
                <div class="total">Итого: ${o.total} ₽</div>
                <div class="status-row"><span class="status-badge ${badgeClass}">${badgeText}</span></div>
                <div class="order-actions">
                    ${o.status !== 'work' && o.status !== 'done' ? `<button class="btn-small" data-id="${o.id}" data-status="work">В работу</button>` : ''}
                    ${o.status !== 'done' ? `<button class="btn-small" data-id="${o.id}" data-status="done">Выполнен</button>` : ''}
                </div>
            `;
            div.querySelectorAll('.order-actions button').forEach(btn => {
                btn.addEventListener('click', async () => {
                    await updateDoc(doc(db, "orders", btn.dataset.id), { status: btn.dataset.status });
                });
            });
            container.appendChild(div);
        });
    };

    window.renderProducts = function() {
        const container = document.getElementById('products-list');
        if (allProducts.length === 0) { container.innerHTML = '<div class="empty">Товаров нет. Добавьте первый!</div>'; return; }
        container.innerHTML = '';
        allProducts.forEach(p => {
            const div = document.createElement('div');
            div.className = 'product-row';
            const img = p.images[0] || 'https://via.placeholder.com/64?text=No';
            const sizesText = p.sizes.length ? ' • ' + p.sizes.join(', ') : '';
            div.innerHTML = `
                <img src="${img}" onerror="this.src='https://via.placeholder.com/64?text=No'">
                <div class="info">
                    <h3>${p.name}</h3>
                    <div class="meta">${p.category}${sizesText}</div>
                    <div class="price">${p.price} ₽</div>
                </div>
                <div class="actions">
                    <button class="btn-edit" data-id="${p.id}" data-action="edit">Изменить</button>
                    <button class="btn-del" data-id="${p.id}" data-action="delete">Удалить</button>
                </div>
            `;
            div.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', () => {
                    if (btn.dataset.action === 'edit') startEdit(btn.dataset.id);
                    else deleteProduct(btn.dataset.id, p.name);
                });
            });
            container.appendChild(div);
        });
    };

    function startEdit(id) {
        const p = allProducts.find(x => x.id === id);
        if (!p) return;
        editingId = id;
        currentImages = [...p.images];
        document.getElementById('f-name').value = p.name;
        document.getElementById('f-desc').value = p.description;
        document.getElementById('f-price').value = p.price;
        document.getElementById('f-category').value = p.category;
        document.getElementById('f-sizes').value = p.sizes.join(', ');
        renderPreviewImages();
        document.getElementById('form-title').innerText = 'Редактирование';
        document.getElementById('cancel-edit-btn').style.display = 'inline-block';
        document.getElementById('form-status').innerText = '';
        switchTab('add');
        document.getElementById('page-title').innerText = 'Редактирование';
    }

    window.cancelEdit = function() {
        editingId = null;
        currentImages = [];
        document.getElementById('f-name').value = '';
        document.getElementById('f-desc').value = '';
        document.getElementById('f-price').value = '';
        document.getElementById('f-category').value = '';
        document.getElementById('f-sizes').value = '';
        document.getElementById('preview-imgs').innerHTML = '';
        document.getElementById('form-title').innerText = 'Новый товар';
        document.getElementById('cancel-edit-btn').style.display = 'none';
        document.getElementById('form-status').innerText = '';
        switchTab('products');
    };

    window.saveProduct = async function() {
        const name = document.getElementById('f-name').value.trim();
        const desc = document.getElementById('f-desc').value.trim();
        const price = Number(document.getElementById('f-price').value);
        const category = document.getElementById('f-category').value.trim() || 'Без категории';
        const sizesRaw = document.getElementById('f-sizes').value.trim();
        const status = document.getElementById('form-status');

        if (!name || !price) { status.style.color = 'var(--danger)'; status.innerText = 'Заполните название и цену'; return; }
        if (currentImages.length === 0) { status.style.color = 'var(--danger)'; status.innerText = 'Добавьте хотя бы одно фото'; return; }

        const sizes = sizesRaw ? sizesRaw.split(',').map(s => s.trim()).filter(s => s) : [];

        const data = {
            name, description: desc, price, category, sizes,
            images: currentImages,
            updatedAt: new Date()
        };

        status.style.color = 'var(--text-muted)';
        status.innerText = 'Сохраняем...';

        try {
            if (editingId) {
                await updateDoc(doc(db, "products", editingId), data);
                status.style.color = 'var(--success)';
                status.innerText = 'Товар обновлён';
            } else {
                data.createdAt = new Date();
                await addDoc(collection(db, "products"), data);
                status.style.color = 'var(--success)';
                status.innerText = 'Товар добавлен';
            }
            setTimeout(() => {
                document.getElementById('f-name').value = '';
                document.getElementById('f-desc').value = '';
                document.getElementById('f-price').value = '';
                document.getElementById('f-category').value = '';
                document.getElementById('f-sizes').value = '';
                currentImages = [];
                document.getElementById('preview-imgs').innerHTML = '';
                editingId = null;
                document.getElementById('form-title').innerText = 'Новый товар';
                document.getElementById('cancel-edit-btn').style.display = 'none';
                document.getElementById('form-status').innerText = '';
            }, 800);
        } catch (e) {
            status.style.color = 'var(--danger)';
            status.innerText = 'Ошибка: ' + e.message;
        }
    };

    async function deleteProduct(id, name) {
        if (!confirm(`Удалить товар "${name}"?`)) return;
        try { await deleteDoc(doc(db, "products", id)); }
        catch (e) { alert('Ошибка: ' + e.message); }
    }
</script>
</body>
</html>
