<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Админ-панель</title>
    <style>
        :root {
            --bg: #eaf2fb; --card: #f7fbff; --text: #1e2a3a; --text-muted: #6b7c93;
            --primary: #2a6fb0; --primary-soft: #bcd6f0; --border: #d0e0f0;
            --danger: #c05c5c; --warning: #c9a05a; --success: #4a8c6b;
            --accepted: #c98a5a; --processing: #c9a05a; --delivery: #4a7fa0; --cancelled: #8a827a;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; background: var(--bg); color: var(--text); padding-bottom: 70px; }

        #login-box { text-align: center; padding: 80px 20px; max-width: 400px; margin: 0 auto; }
        #login-box h1 { font-weight: 500; font-size: 22px; margin-bottom: 24px; }
        #login-box input { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 12px; font-size: 15px; background: var(--card); margin-bottom: 12px; box-sizing: border-box; color: var(--text); }
        #login-box button { width: 100%; padding: 14px; border: none; border-radius: 12px; background: var(--primary); color: var(--card); font-size: 15px; font-weight: 500; cursor: pointer; }

        #panel { display: none; }
        .header { padding: 18px 20px 10px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { margin: 0; font-size: 22px; font-weight: 500; letter-spacing: 0.5px; }
        .live-badge { display: inline-block; background: var(--success); color: white; padding: 3px 8px; border-radius: 10px; font-size: 10px; margin-left: 6px; vertical-align: middle; }

        .container { padding: 0 20px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .order-card { background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 12px; border-left: 3px solid var(--border); }
        .order-card.new { border-left-color: var(--danger); animation: flash 2s; }
        @keyframes flash { 0%,100% { background: var(--card); } 50% { background: #e3eefb; } }
        .order-card h3 { margin: 0 0 6px; font-size: 15px; font-weight: 600; }
        .order-card .meta { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; line-height: 1.4; }
        .order-card .items { margin-bottom: 10px; }
        .order-card .total { font-weight: 600; font-size: 15px; margin-bottom: 10px; color: var(--primary); }
        .order-card .status-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        .status-badge { padding: 5px 12px; border-radius: 10px; font-size: 12px; color: white; font-weight: 500; }
        .status-new { background: var(--danger); }
        .status-accepted { background: var(--accepted); }
        .status-processing { background: var(--processing); }
        .status-delivery { background: var(--delivery); }
        .status-done { background: var(--success); }
        .status-cancelled { background: var(--cancelled); }

        .status-select { padding: 8px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; background: var(--bg); color: var(--text); cursor: pointer; }

        .meeting-section { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border); }
        .meeting-section label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        .meeting-section input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; margin-bottom: 8px; background: var(--bg); color: var(--text); font-family: inherit; }
        .meeting-section .save-btn { background: var(--primary); color: var(--card); border: none; padding: 8px 14px; border-radius: 8px; font-size: 12px; cursor: pointer; }
        .meeting-info { background: var(--primary-soft); border-radius: 8px; padding: 10px; margin-top: 8px; font-size: 12px; line-height: 1.5; }

        .order-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
        .delete-btn { background: none; border: none; color: var(--danger); font-size: 12px; cursor: pointer; text-decoration: underline; padding: 6px 0; }

        .product-row { background: var(--card); border-radius: 12px; padding: 12px; margin-bottom: 10px; display: flex; gap: 12px; align-items: center; }
        .product-row img { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; background: #d8e6f5; flex-shrink: 0; }
        .product-row .info { flex: 1; min-width: 0; }
        .product-row .info h3 { margin: 0 0 3px; font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .product-row .info .meta { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
        .product-row .info .price { font-weight: 600; color: var(--primary); font-size: 14px; }
        .product-row .actions { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
        .product-row .actions button { padding: 6px 10px; border-radius: 8px; font-size: 11px; cursor: pointer; border: none; }
        .btn-edit { background: var(--primary-soft); color: var(--text); }
        .btn-del { background: #f0d8d8; color: var(--danger); }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group input, .form-group textarea { width: 100%; padding: 13px; border: 1px solid var(--border); border-radius: 12px; font-size: 14px; background: var(--card); color: var(--text); font-family: inherit; }
        .form-group textarea { resize: vertical; min-height: 60px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        @media (max-width: 500px) { .form-row { grid-template-columns: 1fr; } }

        .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 15px; font-weight: 500; cursor: pointer; }
        .btn-primary { background: var(--primary); color: var(--card); }
        .btn-secondary { background: var(--border); color: var(--text); }
        .status-msg { font-size: 13px; margin-top: 8px; }

        .filter-row { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
        .filter-row select { padding: 8px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; background: var(--card); color: var(--text); }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); z-index: 50; }
        .nav-item { display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-muted); padding: 6px 12px; border-radius: 12px; transition: 0.2s; position: relative; }
        .nav-item.active { color: var(--primary); }
        .nav-item svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
        .nav-badge { background: var(--danger); color: white; border-radius: 50%; padding: 1px 5px; font-size: 10px; position: absolute; top: 0; right: 4px; font-weight: 600; }

        .empty { text-align: center; color: var(--text-muted); padding: 40px 0; font-size: 14px; }

        .upload-btn { background: var(--primary-soft); color: var(--text); padding: 12px; border-radius: 12px; border: none; font-size: 14px; cursor: pointer; width: 100%; }
        .preview-imgs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
        .preview-imgs .img-wrap { position: relative; }
        .preview-imgs img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; }
        .preview-imgs .del-img { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; background: var(--danger); color: white; border: none; font-size: 12px; line-height: 1; cursor: pointer; padding: 0; }
        .hint { font-size: 11px; color: var(--text-muted); margin-top: 6px; }

        .history-note { font-size: 12px; color: var(--text-muted); margin-bottom: 14px; padding: 10px; background: var(--card); border-radius: 10px; line-height: 1.5; }

        .order-item-row { display:flex; gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--border); }
        .order-item-row:last-child { border-bottom: none; }
        .order-item-row img { width:48px; height:48px; object-fit:cover; border-radius:8px; background:#d8e6f5; flex-shrink:0; }
        .order-item-info { flex:1; min-width:0; }
        .order-item-name { font-size:13px; font-weight:500; line-height:1.3; }
        .order-item-meta { font-size:11px; color:var(--text-muted); margin-top:2px; }
        .order-item-price { font-size:13px; font-weight:600; color:var(--primary); flex-shrink:0; }

        .stock-check { display: flex; align-items: center; gap: 10px; padding: 12px; background: var(--card); border-radius: 12px; cursor: pointer; }
        .stock-check input { width: 20px; height: 20px; cursor: pointer; accent-color: var(--primary); }
        .stock-check span { font-size: 14px; }

        .waitlist-item { background: var(--card); border-radius: 12px; padding: 14px; margin-bottom: 10px; display: flex; gap: 12px; align-items: center; }
        .waitlist-item img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; background: #d8e6f5; flex-shrink: 0; }
        .waitlist-item .info { flex: 1; min-width: 0; }
        .waitlist-item .info h3 { margin: 0 0 4px; font-size: 14px; font-weight: 500; }
        .waitlist-item .info .meta { font-size: 12px; color: var(--text-muted); line-height: 1.4; }
        .waitlist-item .del-btn { background: none; border: none; color: var(--danger); font-size: 12px; cursor: pointer; text-decoration: underline; flex-shrink: 0; }
    </style>
</head>
<body>

<div id="login-box">
    <h1>Админ-панель</h1>
    <input type="password" id="password" placeholder="Пароль">
    <button onclick="checkPassword()">Войти</button>
    <div id="login-status" style="color:var(--danger); margin-top:12px; font-size:13px;"></div>
</div>

<div id="panel">
    <div class="header">
        <h1 id="page-title">Заказы</h1>
        <span class="live-badge" id="live-badge" style="display:none;">LIVE</span>
    </div>

    <!-- АКТИВНЫЕ -->
    <div id="tab-orders" class="tab-content active container">
        <div class="filter-row">
            <select id="order-filter" onchange="renderOrders()">
                <option value="">Все активные</option>
                <option value="new">Новые</option>
                <option value="accepted">Принято</option>
                <option value="processing">Взят в обработку</option>
                <option value="delivery">В процессе доставки</option>
            </select>
        </div>
        <div id="orders-list"></div>
    </div>

    <!-- ИСТОРИЯ -->
    <div id="tab-history" class="tab-content container">
        <div class="history-note">Заказы со статусами «Завершён» и «Отказ».</div>
        <div class="filter-row">
            <select id="history-filter" onchange="renderHistory()">
                <option value="">Все завершённые</option>
                <option value="done">Завершён</option>
                <option value="cancelled">Отказ</option>
            </select>
        </div>
        <div id="history-list"></div>
    </div>

    <!-- ОЖИДАЮТ -->
    <div id="tab-waitlist" class="tab-content container">
        <div class="history-note">Клиенты, которые ждут появления товара. Когда товар придёт — свяжитесь и удалите запись.</div>
        <div id="waitlist-list"></div>
    </div>

    <!-- ТОВАРЫ -->
    <div id="tab-products" class="tab-content container">
        <div id="products-list"></div>
    </div>

    <!-- ДОБАВИТЬ -->
    <div id="tab-add" class="tab-content container">
        <h2 id="form-title" style="font-size:17px; font-weight:500; margin: 0 0 16px;">Новый товар</h2>
        <div class="form-group">
            <label>Название</label>
            <input type="text" id="f-name" placeholder="Например: Свитер">
        </div>
        <div class="form-group">
            <label>Описание</label>
            <textarea id="f-desc" placeholder="Материал, особенности..."></textarea>
        </div>
        <div class="form-row">
            <div class="form-group"><label>Цена (₽)</label><input type="number" id="f-price" placeholder="4900"></div>
            <div class="form-group"><label>Категория</label><input type="text" id="f-category" placeholder="Свитеры"></div>
        </div>
        <div class="form-group">
            <label>Размеры (через запятую)</label>
            <input type="text" id="f-sizes" placeholder="S, M, L, XL">
        </div>
        <div class="form-group">
            <label class="stock-check">
                <input type="checkbox" id="f-instock" checked>
                <span>В наличии</span>
            </label>
        </div>
        <div class="form-group">
            <label>Фотографии (до 7 шт.)</label>
            <input type="file" id="photo-input" accept="image/*" multiple style="display:none;" onchange="handlePhotoSelect(event)">
            <button type="button" class="upload-btn" onclick="document.getElementById('photo-input').click()">📷 Выбрать фото с телефона</button>
            <div class="preview-imgs" id="preview-imgs"></div>
            <div class="hint" id="photo-hint">До 7 фото, каждое сжимается до ~100–150 КБ.</div>
        </div>
        <div id="form-status" class="status-msg"></div>
        <div style="display:flex; gap:10px; margin-top: 16px;">
            <button class="btn btn-primary" onclick="saveProduct()">Сохранить</button>
            <button class="btn btn-secondary" id="cancel-edit-btn" style="display:none;" onclick="cancelEdit()">Отмена</button>
        </div>
    </div>

    <!-- НАВИГАЦИЯ -->
    <div class="bottom-nav">
        <div class="nav-item active" id="nav-orders" onclick="switchTab('orders')" style="position:relative;">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
            <span class="nav-badge" id="orders-badge" style="display:none;">0</span>
        </div>
        <div class="nav-item" id="nav-history" onclick="switchTab('history')">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        </div>
        <div class="nav-item" id="nav-waitlist" onclick="switchTab('waitlist')" style="position:relative;">
            <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            <span class="nav-badge" id="waitlist-badge" style="display:none;">0</span>
        </div>
        <div class="nav-item" id="nav-products" onclick="switchTab('products')">
            <svg viewBox="0 0 24 24"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>
        </div>
        <div class="nav-item" id="nav-add" onclick="switchTab('add')">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </div>
    </div>
</div>

<script type="module">
    const firebaseConfig = {
        apiKey: "AIzaSyAtmwSKze_P9F_4Wkd5ZPD45bGNmDXEQ58",
        authDomain: "my-shop-22c14.firebaseapp.com",
        projectId: "my-shop-22c14",
        storageBucket: "my-shop-22c14.firebasestorage.app",
        messagingSenderId: "1029158788389",
        appId: "1:1029158788389:web:01bfc85675c52ae315cecc"
    };

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const ADMIN_PASSWORD = "arhip2026";

    const STATUSES = {
        new:        { text: 'Новый',               cls: 'status-new' },
        accepted:   { text: 'Принято',             cls: 'status-accepted' },
        processing: { text: 'Взят в обработку',    cls: 'status-processing' },
        delivery:   { text: 'В процессе доставки', cls: 'status-delivery' },
        done:       { text: 'Завершён',            cls: 'status-done' },
        cancelled:  { text: 'Отказ',               cls: 'status-cancelled' }
    };
    function normalizeStatus(s) {
        if (!s) return 'new';
        if (s === 'work') return 'processing';
        if (STATUSES[s]) return s;
        return 'new';
    }

    let allProducts = [];
    let allOrders = [];
    let allWaitlist = [];
    let editingId = null;
    let currentImages = [];
    let knownOrderIds = new Set();
    let firstOrdersLoad = true;
    let unsubOrders = null;
    let unsubProducts = null;
    let unsubWaitlist = null;

    // ==== СЖАТИЕ (сильнее, для 7 фото) ====
    function compressImage(file, maxSide = 600, quality = 0.55) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    let { width, height } = img;
                    if (width > height && width > maxSide) { height = Math.round(height * maxSide / width); width = maxSide; }
                    else if (height > maxSide) { width = Math.round(width * maxSide / height); height = maxSide; }
                    const canvas = document.createElement('canvas');
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = reject;
                img.src = e.target.result;
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    window.handlePhotoSelect = async function(event) {
        const files = Array.from(event.target.files);
        if (!files.length) return;
        const hint = document.getElementById('photo-hint');
        const MAX_PHOTOS = 7;
        if (currentImages.length + files.length > MAX_PHOTOS) {
            alert(`Можно не больше ${MAX_PHOTOS} фото. Сейчас уже ${currentImages.length}.`);
            event.target.value = '';
            return;
        }
        hint.innerText = 'Сжимаем фото...';
        for (const file of files) {
            try {
                const base64 = await compressImage(file);
                const sizeKb = Math.round(base64.length / 1024);
                if (sizeKb > 250) { alert('Фото слишком большое после сжатия, попробуйте другое.'); continue; }
                currentImages.push(base64);
            } catch (err) { alert('Ошибка обработки: ' + err.message); }
        }
        event.target.value = '';
        hint.innerText = 'До 7 фото, каждое сжимается до ~100–150 КБ.';
        renderPreviewImages();
    };

    function renderPreviewImages() {
        const container = document.getElementById('preview-imgs');
        container.innerHTML = currentImages.map((src, idx) => `
            <div class="img-wrap">
                <img src="${src}">
                <button class="del-img" onclick="removeImage(${idx})">×</button>
            </div>
        `).join('');
    }

    window.removeImage = function(idx) { currentImages.splice(idx, 1); renderPreviewImages(); };

    // ==== ВХОД ====
    window.checkPassword = function() {
        if (document.getElementById('password').value === ADMIN_PASSWORD) {
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('panel').style.display = 'block';
            localStorage.setItem('admin_ok', '1');
            startListening();
        } else {
            document.getElementById('login-status').innerText = 'Неверный пароль';
        }
    };

    if (localStorage.getItem('admin_ok') === '1') {
        document.getElementById('login-box').style.display = 'none';
        document.getElementById('panel').style.display = 'block';
        startListening();
    }

    window.switchTab = function(name) {
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        document.getElementById('nav-' + name).classList.add('active');
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.getElementById('tab-' + name).classList.add('active');
        const titles = { orders: 'Заказы', history: 'История', waitlist: 'Ожидают', products: 'Товары', add: editingId ? 'Редактирование' : 'Новый товар' };
        document.getElementById('page-title').innerText = titles[name];
        document.getElementById('live-badge').style.display = (name === 'orders' && !firstOrdersLoad) ? 'inline-block' : 'none';
    };

    function startListening() {
        if (!unsubOrders) {
            unsubOrders = onSnapshot(collection(db, "orders"), (snap) => {
                allOrders = [];
                let newOnes = 0;
                snap.forEach(d => {
                    const data = { id: d.id, ...d.data() };
                    allOrders.push(data);
                    if (!knownOrderIds.has(d.id)) { knownOrderIds.add(d.id); if (!firstOrdersLoad) newOnes++; }
                });
                allOrders.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                const newCount = allOrders.filter(o => normalizeStatus(o.status) === 'new').length;
                const badge = document.getElementById('orders-badge');
                if (newCount > 0) { badge.style.display = 'block'; badge.innerText = newCount; }
                else { badge.style.display = 'none'; }
                if (newOnes > 0) document.title = `(${newCount}) Админка`;
                firstOrdersLoad = false;
                renderOrders(newOnes > 0 ? allOrders[0].id : null);
                renderHistory();
            }, (err) => {
                document.getElementById('orders-list').innerHTML = '<p style="color:var(--danger);">Ошибка: ' + err.message + '</p>';
            });
        }
        if (!unsubProducts) {
            unsubProducts = onSnapshot(collection(db, "products"), (snap) => {
                allProducts = [];
                snap.forEach(d => {
                    const p = d.data();
                    let images = p.images;
                    if (!images || !Array.isArray(images) || images.length === 0) {
                        if (p.imageUrls && Array.isArray(p.imageUrls) && p.imageUrls.length) images = p.imageUrls;
                        else if (p.imageUrl) images = [p.imageUrl];
                        else images = [];
                    }
                    allProducts.push({
                        id: d.id, name: p.name || '', description: p.description || '',
                        price: p.price || 0, category: p.category || 'Без категории',
                        sizes: p.sizes || [], images,
                        inStock: p.inStock !== false
                    });
                });
                allProducts.sort((a, b) => a.name.localeCompare(b.name));
                renderProducts();
            });
        }
        if (!unsubWaitlist) {
            unsubWaitlist = onSnapshot(collection(db, "waitlist"), (snap) => {
                allWaitlist = [];
                snap.forEach(d => allWaitlist.push({ id: d.id, ...d.data() }));
                allWaitlist.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                const badge = document.getElementById('waitlist-badge');
                if (allWaitlist.length > 0) { badge.style.display = 'block'; badge.innerText = allWaitlist.length; }
                else { badge.style.display = 'none'; }
                renderWaitlist();
            });
        }
    }

    function buildOrderCard(o, highlightId, showMeeting) {
        const st = normalizeStatus(o.status);
        const stInfo = STATUSES[st];
        const div = document.createElement('div');
        div.className = 'order-card' + (o.id === highlightId ? ' new' : '');
        const date = o.createdAt?.seconds ? new Date(o.createdAt.seconds * 1000).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';

        const itemsHtml = (o.items || []).map(i => {
            const imgSrc = i.image || 'https://via.placeholder.com/48?text=No';
            const sizeText = i.size ? `Размер: ${i.size}` : '';
            const qtyText = i.qty > 1 ? ` ×${i.qty}` : '';
            return `
                <div class="order-item-row">
                    <img src="${imgSrc}" onerror="this.src='https://via.placeholder.com/48?text=No'">
                    <div class="order-item-info">
                        <div class="order-item-name">${i.name}${qtyText}</div>
                        ${sizeText ? `<div class="order-item-meta">${sizeText}</div>` : ''}
                    </div>
                    <div class="order-item-price">${i.price * (i.qty || 1)} ₽</div>
                </div>
            `;
        }).join('');

        const meetingInfo = (o.meetingAddress || o.meetingTime) ? `
            <div class="meeting-info">
                ${o.meetingAddress ? `<div><b>Адрес:</b> ${o.meetingAddress}</div>` : ''}
                ${o.meetingTime ? `<div><b>Время:</b> ${o.meetingTime}</div>` : ''}
            </div>
        ` : '';

        const optionsHtml = Object.keys(STATUSES).map(key =>
            `<option value="${key}" ${key === st ? 'selected' : ''}>${STATUSES[key].text}</option>`
        ).join('');

        div.innerHTML = `
            <h3>${o.customerName || 'Без имени'}</h3>
            <div class="meta">${o.customerPhone || ''}${o.customerTelegram ? ' • ' + o.customerTelegram : ''}<br>${date}</div>
            <div class="items">${itemsHtml}</div>
            <div class="total">Итого: ${o.total} ₽</div>
            <div class="status-row">
                <span class="status-badge ${stInfo.cls}">${stInfo.text}</span>
                <select class="status-select" data-id="${o.id}">${optionsHtml}</select>
            </div>
            ${showMeeting ? `
                <div class="meeting-section">
                    <label>Адрес встречи</label>
                    <input type="text" id="addr-${o.id}" value="${o.meetingAddress || ''}" placeholder="Например: ТЦ Аримарх, 1 этаж">
                    <label>Время встречи</label>
                    <input type="text" id="time-${o.id}" value="${o.meetingTime || ''}" placeholder="Например: 14 октября, 15:00">
                    <button class="save-btn" data-id="${o.id}">Сохранить встречу</button>
                    ${meetingInfo}
                </div>
            ` : meetingInfo}
            <div class="order-footer">
                <span style="font-size:11px; color:var(--text-muted);">Заказ №${o.id.slice(-6)}</span>
                <button class="delete-btn" data-id="${o.id}">Удалить заказ</button>
            </div>
        `;

        div.querySelector('.status-select').addEventListener('change', async (e) => {
            await updateDoc(doc(db, "orders", o.id), { status: e.target.value });
        });
        const saveBtn = div.querySelector('.save-btn');
        if (saveBtn) {
            saveBtn.addEventListener('click', async () => {
                const addr = document.getElementById('addr-' + o.id).value.trim();
                const time = document.getElementById('time-' + o.id).value.trim();
                await updateDoc(doc(db, "orders", o.id), { meetingAddress: addr, meetingTime: time });
                saveBtn.innerText = 'Сохранено ✓';
                setTimeout(() => { saveBtn.innerText = 'Сохранить встречу'; }, 1500);
            });
        }
        div.querySelector('.delete-btn').addEventListener('click', async () => {
            if (!confirm(`Удалить заказ №${o.id.slice(-6)}?`)) return;
            try { await deleteDoc(doc(db, "orders", o.id)); }
            catch (e) { alert('Ошибка: ' + e.message); }
        });
        return div;
    }

    window.renderOrders = function(highlightId) {
        const filter = document.getElementById('order-filter').value;
        const container = document.getElementById('orders-list');
        const filtered = allOrders.filter(o => {
            const st = normalizeStatus(o.status);
            if (st === 'done' || st === 'cancelled') return false;
            return !filter || st === filter;
        });
        if (filtered.length === 0) { container.innerHTML = '<div class="empty">Активных заказов нет</div>'; return; }
        container.innerHTML = '';
        filtered.forEach(o => container.appendChild(buildOrderCard(o, highlightId, true)));
    };

    window.renderHistory = function() {
        const filter = document.getElementById('history-filter').value;
        const container = document.getElementById('history-list');
        const filtered = allOrders.filter(o => {
            const st = normalizeStatus(o.status);
            if (st !== 'done' && st !== 'cancelled') return false;
            return !filter || st === filter;
        });
        if (filtered.length === 0) { container.innerHTML = '<div class="empty">История пуста</div>'; return; }
        container.innerHTML = '';
        filtered.forEach(o => container.appendChild(buildOrderCard(o, null, false)));
    };

    window.renderWaitlist = function() {
        const container = document.getElementById('waitlist-list');
        if (allWaitlist.length === 0) { container.innerHTML = '<div class="empty">Никто не ждёт товар</div>'; return; }
        container.innerHTML = '';
        allWaitlist.forEach(w => {
            const div = document.createElement('div');
            div.className = 'waitlist-item';
            const date = w.createdAt?.seconds ? new Date(w.createdAt.seconds * 1000).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
            div.innerHTML = `
                <img src="${w.productImage || 'https://via.placeholder.com/56?text=No'}" onerror="this.src='https://via.placeholder.com/56?text=No'">
                <div class="info">
                    <h3>${w.productName}</h3>
                    <div class="meta">${w.customerName} • ${w.customerPhone}${w.customerTelegram ? ' • ' + w.customerTelegram : ''}<br>${date}</div>
                </div>
                <button class="del-btn" data-id="${w.id}">Удалить</button>
            `;
            div.querySelector('.del-btn').addEventListener('click', async () => {
                if (!confirm(`Удалить запись "${w.customerName}" по товару "${w.productName}"?`)) return;
                await deleteDoc(doc(db, "waitlist", w.id));
            });
            container.appendChild(div);
        });
    };

    window.renderProducts = function() {
        const container = document.getElementById('products-list');
        if (allProducts.length === 0) { container.innerHTML = '<div class="empty">Товаров нет. Добавьте первый!</div>'; return; }
        container.innerHTML = '';
        allProducts.forEach(p => {
            const div = document.createElement('div');
            div.className = 'product-row';
            const img = p.images[0] || 'https://via.placeholder.com/64?text=No';
            const sizesText = p.sizes.length ? ' • ' + p.sizes.join(', ') : '';
            const stockText = p.inStock ? '' : ' • <span style="color:var(--danger);">Нет в наличии</span>';
            div.innerHTML = `
                <img src="${img}" onerror="this.src='https://via.placeholder.com/64?text=No'">
                <div class="info">
                    <h3>${p.name}</h3>
                    <div class="meta">${p.category}${sizesText}${stockText}</div>
                    <div class="price">${p.price} ₽</div>
                </div>
                <div class="actions">
                    <button class="btn-edit" data-id="${p.id}" data-action="edit">Изменить</button>
                    <button class="btn-del" data-id="${p.id}" data-action="delete">Удалить</button>
                </div>
            `;
            div.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', () => {
                    if (btn.dataset.action === 'edit') startEdit(btn.dataset.id);
                    else deleteProduct(btn.dataset.id, p.name);
                });
            });
            container.appendChild(div);
        });
    };

    function startEdit(id) {
        const p = allProducts.find(x => x.id === id);
        if (!p) return;
        editingId = id;
        currentImages = [...p.images];
        document.getElementById('f-name').value = p.name;
        document.getElementById('f-desc').value = p.description;
        document.getElementById('f-price').value = p.price;
        document.getElementById('f-category').value = p.category;
        document.getElementById('f-sizes').value = p.sizes.join(', ');
        document.getElementById('f-instock').checked = p.inStock;
        renderPreviewImages();
        document.getElementById('form-title').innerText = 'Редактирование';
        document.getElementById('cancel-edit-btn').style.display = 'inline-block';
        document.getElementById('form-status').innerText = '';
        switchTab('add');
        document.getElementById('page-title').innerText = 'Редактирование';
    }

    window.cancelEdit = function() {
        editingId = null;
        currentImages = [];
        document.getElementById('f-name').value = '';
        document.getElementById('f-desc').value = '';
        document.getElementById('f-price').value = '';
        document.getElementById('f-category').value = '';
        document.getElementById('f-sizes').value = '';
        document.getElementById('f-instock').checked = true;
        document.getElementById('preview-imgs').innerHTML = '';
        document.getElementById('form-title').innerText = 'Новый товар';
        document.getElementById('cancel-edit-btn').style.display = 'none';
        document.getElementById('form-status').innerText = '';
        switchTab('products');
    };

    window.saveProduct = async function() {
        const name = document.getElementById('f-name').value.trim();
        const desc = document.getElementById('f-desc').value.trim();
        const price = Number(document.getElementById('f-price').value);
        const category = document.getElementById('f-category').value.trim() || 'Без категории';
        const sizesRaw = document.getElementById('f-sizes').value.trim();
        const inStock = document.getElementById('f-instock').checked;
        const status = document.getElementById('form-status');
        if (!name || !price) { status.style.color = 'var(--danger)'; status.innerText = 'Заполните название и цену'; return; }
        if (currentImages.length === 0) { status.style.color = 'var(--danger)'; status.innerText = 'Добавьте хотя бы одно фото'; return; }
        const sizes = sizesRaw ? sizesRaw.split(',').map(s => s.trim()).filter(s => s) : [];
        const data = { name, description: desc, price, category, sizes, images: currentImages, inStock, updatedAt: new Date() };
        status.style.color = 'var(--text-muted)';
        status.innerText = 'Сохраняем...';
        try {
            if (editingId) {
                await updateDoc(doc(db, "products", editingId), data);
                status.style.color = 'var(--success)';
                status.innerText = 'Товар обновлён';
            } else {
                data.createdAt = new Date();
                await addDoc(collection(db, "products"), data);
                status.style.color = 'var(--success)';
                status.innerText = 'Товар добавлен';
            }
            setTimeout(() => {
                document.getElementById('f-name').value = '';
                document.getElementById('f-desc').value = '';
                document.getElementById('f-price').value = '';
                document.getElementById('f-category').value = '';
                document.getElementById('f-sizes').value = '';
                document.getElementById('f-instock').checked = true;
                currentImages = [];
                document.getElementById('preview-imgs').innerHTML = '';
                editingId = null;
                document.getElementById('form-title').innerText = 'Новый товар';
                document.getElementById('cancel-edit-btn').style.display = 'none';
                document.getElementById('form-status').innerText = '';
            }, 800);
        } catch (e) {
            status.style.color = 'var(--danger)';
            status.innerText = 'Ошибка: ' + e.message;
        }
    };

    async function deleteProduct(id, name) {
        if (!confirm(`Удалить товар "${name}"?`)) return;
        try { await deleteDoc(doc(db, "products", id)); }
        catch (e) { alert('Ошибка: ' + e.message); }
    }
</script>
</body>
</html>
