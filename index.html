<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Каталог</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #f0ece6; --card: #faf8f5; --text: #3a3632; --text-muted: #8a827a;
            --primary: #6b6259; --primary-soft: #d6cec4; --border: #e0d9d0;
            --danger: #b85c5c; --success: #6b8e6b;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; background: var(--bg); color: var(--text); padding-bottom: 60px; }

        .header { padding: 18px 20px 10px; background: var(--bg); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
        .header h1 { margin: 0; font-size: 22px; font-weight: 500; letter-spacing: 0.5px; }
        .header .icon { font-size: 18px; opacity: 0.6; cursor: pointer; }

        .container { padding: 0 20px; }
        .categories { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 18px; scrollbar-width: none; }
        .categories::-webkit-scrollbar { display: none; }
        .category-btn { padding: 7px 14px; background: transparent; border: 1px solid var(--border); border-radius: 20px; font-size: 13px; white-space: nowrap; cursor: pointer; color: var(--text-muted); transition: 0.25s; }
        .category-btn.active { background: var(--primary); color: #faf8f5; border-color: var(--primary); }

        .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
        .product-card { background: var(--card); border-radius: 14px; overflow: hidden; cursor: pointer; transition: transform 0.2s; }
        .product-card:active { transform: scale(0.98); }
        .product-card img { width: 100%; height: 170px; object-fit: cover; background: #e8e2da; }
        .product-card .info { padding: 12px; }
        .product-card .info h3 { margin: 0 0 4px; font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .product-card .info .price { font-weight: 600; font-size: 14px; margin-bottom: 2px; color: var(--primary); }
        .product-card .info .sizes { font-size: 11px; color: var(--text-muted); }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(58,54,50,0.35); z-index: 100; align-items: flex-end; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: var(--card); width: 100%; max-width: 500px; border-radius: 20px 20px 0 0; max-height: 90vh; display: flex; flex-direction: column; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .modal-header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .modal-header h2 { margin: 0; font-size: 17px; font-weight: 500; }
        .modal-header .close-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-muted); line-height: 1; padding: 0; }
        .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
        .modal-footer { padding: 15px 20px; border-top: 1px solid var(--border); }

        .product-detail-img { width: 100%; height: 260px; object-fit: cover; border-radius: 12px; margin-bottom: 16px; background: #e8e2da; }
        .product-detail h2 { margin: 0 0 8px; font-size: 19px; font-weight: 500; }
        .product-detail .price { font-size: 20px; font-weight: 600; margin-bottom: 14px; color: var(--primary); }
        .product-detail .desc { font-size: 14px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5; }
        .size-selector { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
        .size-btn { padding: 8px 16px; border: 1px solid var(--border); border-radius: 10px; background: transparent; cursor: pointer; font-size: 14px; color: var(--text); }
        .size-btn.active { border-color: var(--primary); background: var(--primary); color: #faf8f5; }
        .qty-control { display: flex; align-items: center; gap: 16px; margin-bottom: 10px; }
        .qty-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border); background: transparent; font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text); }
        .qty-value { font-size: 16px; font-weight: 500; min-width: 24px; text-align: center; }

        .btn { width: 100%; padding: 15px; border: none; border-radius: 14px; font-size: 15px; font-weight: 500; cursor: pointer; transition: 0.2s; letter-spacing: 0.3px; }
        .btn-primary { background: var(--primary); color: #faf8f5; }
        .btn-primary:active { background: #5a534b; }
        .btn-small { padding: 8px 14px; border: 1px solid var(--border); background: transparent; border-radius: 10px; font-size: 13px; cursor: pointer; color: var(--text); }

        .cart-item { display: flex; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--border); }
        .cart-item img { width: 76px; height: 76px; object-fit: cover; border-radius: 10px; background: #e8e2da; }
        .cart-item .info { flex: 1; min-width: 0; }
        .cart-item .info h4 { margin: 0 0 4px; font-size: 14px; font-weight: 500; }
        .cart-item .info .meta { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
        .cart-item .info .price { font-weight: 600; font-size: 14px; color: var(--primary); }
        .cart-item .actions { display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end; }
        .cart-item .remove-btn { background: none; border: none; color: var(--text-muted); font-size: 12px; cursor: pointer; text-decoration: underline; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group input { width: 100%; padding: 13px; border: 1px solid var(--border); border-radius: 12px; font-size: 15px; background: var(--bg); color: var(--text); }

        .success-screen { text-align: center; padding: 40px 20px; }
        .success-icon { width: 72px; height: 72px; background: var(--primary-soft); color: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 34px; margin: 0 auto 20px; }
        .success-screen h2 { margin-bottom: 8px; font-weight: 500; }
        .success-screen p { color: var(--text-muted); margin-bottom: 28px; font-size: 14px; line-height: 1.5; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); z-index: 50; }
        .nav-item { display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-muted); padding: 6px 20px; border-radius: 12px; transition: 0.2s; position: relative; }
        .nav-item.active { color: var(--primary); }
        .nav-item svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
        .badge { background: var(--primary); color: #faf8f5; border-radius: 50%; padding: 1px 5px; font-size: 10px; position: absolute; top: 0; right: 12px; font-weight: 600; }

        /* Профиль */
        .profile-name { font-size: 20px; font-weight: 500; margin-bottom: 4px; }
        .profile-username { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
        .profile-section-title { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin: 20px 0 10px; }
        .profile-field { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--border); }
        .profile-field .label { font-size: 14px; color: var(--text-muted); }
        .profile-field .value { font-size: 14px; font-weight: 500; }
        .order-history-item { background: var(--bg); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
        .order-history-item .oh-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .order-history-item .oh-date { font-size: 12px; color: var(--text-muted); }
        .order-history-item .oh-status { font-size: 11px; padding: 3px 8px; border-radius: 8px; color: white; font-weight: 500; }
        .order-history-item .oh-items { font-size: 13px; line-height: 1.5; margin-bottom: 6px; }
        .order-history-item .oh-total { font-weight: 600; font-size: 14px; color: var(--primary); }
        .meeting-box { background: var(--primary-soft); border-radius: 10px; padding: 12px; margin-top: 10px; font-size: 13px; line-height: 1.5; }
        .meeting-box b { color: var(--text); }
        .empty-state { text-align: center; color: var(--text-muted); padding: 30px 0; font-size: 14px; }
    </style>
</head>
<body>

    <div id="main-screen">
        <div class="header">
            <h1>Каталог</h1>
            <div class="icon" onclick="alert('Поиск в разработке')">🔍</div>
        </div>
        <div class="container">
            <div class="categories" id="categories-container"></div>
            <div class="products-grid" id="products-grid"></div>
        </div>
    </div>

    <!-- ТОВАР -->
    <div class="modal-overlay" id="product-modal">
        <div class="modal">
            <div class="modal-header">
                <h2>Товар</h2>
                <button class="close-btn" onclick="closeModal('product-modal')">×</button>
            </div>
            <div class="modal-body" id="product-modal-content"></div>
            <div class="modal-footer" id="product-modal-footer"></div>
        </div>
    </div>

    <!-- КОРЗИНА -->
    <div class="modal-overlay" id="cart-modal">
        <div class="modal">
            <div class="modal-header">
                <h2>Корзина</h2>
                <button class="close-btn" onclick="closeModal('cart-modal')">×</button>
            </div>
            <div class="modal-body" id="cart-modal-content"></div>
            <div class="modal-footer" id="cart-modal-footer"></div>
        </div>
    </div>

    <!-- ОФОРМЛЕНИЕ -->
    <div class="modal-overlay" id="checkout-modal">
        <div class="modal">
            <div class="modal-header">
                <h2>Оформление</h2>
                <button class="close-btn" onclick="closeModal('checkout-modal')">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Имя</label>
                    <input type="text" id="customer-name" placeholder="Иван Иванов">
                </div>
                <div class="form-group">
                    <label>Телефон</label>
                    <input type="tel" id="customer-phone" placeholder="+7 (999) 123-45-67">
                </div>
                <div id="checkout-status" style="color: var(--danger); font-size: 13px;"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="submitOrder()">Подтвердить</button>
            </div>
        </div>
    </div>

    <!-- УСПЕХ -->
    <div class="modal-overlay" id="success-modal">
        <div class="modal">
            <div class="modal-body">
                <div class="success-screen">
                    <div class="success-icon">✓</div>
                    <h2>Заказ оформлен</h2>
                    <p>Мы свяжемся с вами в ближайшее время для подтверждения и назначения встречи.</p>
                    <button class="btn btn-primary" onclick="closeModal('success-modal'); switchTab('catalog');">Вернуться в каталог</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ПРОФИЛЬ -->
    <div class="modal-overlay" id="profile-modal">
        <div class="modal">
            <div class="modal-header">
                <h2>Профиль</h2>
                <button class="close-btn" onclick="closeModal('profile-modal'); switchTab('catalog');">×</button>
            </div>
            <div class="modal-body" id="profile-content">
                <p class="empty-state">Загрузка...</p>
            </div>
        </div>
    </div>

    <!-- НАВИГАЦИЯ -->
    <div class="bottom-nav">
        <div class="nav-item active" id="nav-catalog" onclick="switchTab('catalog')">
            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        </div>
        <div class="nav-item" id="nav-cart" onclick="switchTab('cart')" style="position:relative;">
            <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
            <span class="badge" id="nav-cart-badge" style="display:none;">0</span>
        </div>
        <div class="nav-item" id="nav-profile" onclick="switchTab('profile')">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </div>
    </div>

    <script type="module">
        const firebaseConfig = {
            apiKey: "AIzaSyAtmwSKze_P9F_4Wkd5ZPD45bGNmDXEQ58",
            authDomain: "my-shop-22c14.firebaseapp.com",
            projectId: "my-shop-22c14",
            storageBucket: "my-shop-22c14.firebasestorage.app",
            messagingSenderId: "1029158788389",
            appId: "1:1029158788389:web:01bfc85675c52ae315cecc"
        };

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, doc, getDoc, setDoc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        signInAnonymously(auth).catch(e => console.error("Auth error:", e));

        let allProducts = [];
        let cart = [];
        let currentCategory = '';
        let selectedProduct = null;
        let selectedSize = null;
        let selectedQty = 1;
        let tgUser = null;
        let currentProfile = null;

        // Telegram user
        tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user || null;

        async function init() {
            await loadProducts();
            if (tgUser && tgUser.id) {
                await loadProfile();
            }
        }

        // ===== ПРОФИЛЬ =====
        async function loadProfile() {
            try {
                const ref = doc(db, "profiles", String(tgUser.id));
                const snap = await getDoc(ref);
                if (snap.exists()) {
                    currentProfile = snap.data();
                } else {
                    // Создаём пустой профиль с именем из Telegram
                    currentProfile = {
                        name: tgUser.first_name || '',
                        phone: '',
                        telegramUsername: tgUser.username || ''
                    };
                }
            } catch (e) {
                console.error("Profile load error:", e);
                currentProfile = { name: tgUser.first_name || '', phone: '' };
            }
        }

        async function saveProfile(name, phone) {
            if (!tgUser || !tgUser.id) return;
            const ref = doc(db, "profiles", String(tgUser.id));
            await setDoc(ref, {
                name, phone,
                telegramUsername: tgUser.username || '',
                updatedAt: new Date()
            }, { merge: true });
            currentProfile = { name, phone, telegramUsername: tgUser.username || '' };
        }

        // ===== ТОВАРЫ =====
        async function loadProducts() {
            const snap = await getDocs(collection(db, "products"));
            allProducts = [];
            snap.forEach(d => {
                const p = d.data();
                let images = p.images;
                if (!images || !Array.isArray(images) || images.length === 0) {
                    if (p.imageUrls && Array.isArray(p.imageUrls) && p.imageUrls.length) images = p.imageUrls;
                    else if (p.imageUrl) images = [p.imageUrl];
                    else images = [];
                }
                allProducts.push({
                    id: d.id, name: p.name, description: p.description || '',
                    price: p.price, category: p.category || 'Без категории',
                    sizes: p.sizes || [], images
                });
            });
            renderCategories();
            renderProducts();
        }

        function renderCategories() {
            const cats = [...new Set(allProducts.map(p => p.category))].sort();
            const container = document.getElementById('categories-container');
            container.innerHTML = `<button class="category-btn active" onclick="filterCategory('')">Все</button>` +
                cats.map(c => `<button class="category-btn" onclick="filterCategory('${c.replace(/'/g, "\\'")}')">${c}</button>`).join('');
        }

        window.filterCategory = function(cat) {
            currentCategory = cat;
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText === (cat || 'Все'));
            });
            renderProducts();
        };

        function renderProducts() {
            const container = document.getElementById('products-grid');
            const filtered = allProducts.filter(p => !currentCategory || p.category === currentCategory);
            if (filtered.length === 0) {
                container.innerHTML = '<p style="text-align:center;color:var(--text-muted);grid-column:1/-1;padding:40px 0;">Товаров нет</p>';
                return;
            }
            container.innerHTML = filtered.map(p => `
                <div class="product-card" onclick="openProduct('${p.id}')">
                    <img src="${p.images[0] || 'https://via.placeholder.com/200?text=No'}" alt="${p.name}">
                    <div class="info">
                        <h3>${p.name}</h3>
                        <div class="price">${p.price} ₽</div>
                        <div class="sizes">${p.sizes.length ? p.sizes.join(' · ') : ''}</div>
                    </div>
                </div>
            `).join('');
        }

        window.openProduct = function(id) {
            selectedProduct = allProducts.find(p => p.id === id);
            if (!selectedProduct) return;
            selectedSize = selectedProduct.sizes.length > 0 ? selectedProduct.sizes[0] : null;
            selectedQty = 1;
            const content = document.getElementById('product-modal-content');
            content.innerHTML = `
                <div class="product-detail">
                    <img src="${selectedProduct.images[0] || 'https://via.placeholder.com/300?text=No'}" class="product-detail-img" id="main-detail-img">
                    ${selectedProduct.images.length > 1 ? `
                        <div style="display:flex; gap:8px; margin-bottom:16px; overflow-x:auto;">
                            ${selectedProduct.images.map(img => `<img src="${img}" style="width:60px;height:60px;object-fit:cover;border-radius:8px;cursor:pointer;" onclick="document.getElementById('main-detail-img').src='${img}'">`).join('')}
                        </div>
                    ` : ''}
                    <h2>${selectedProduct.name}</h2>
                    <div class="price">${selectedProduct.price} ₽</div>
                    <div class="desc">${selectedProduct.description}</div>
                    ${selectedProduct.sizes.length > 0 ? `
                        <div style="margin-bottom: 8px; font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;">Размер</div>
                        <div class="size-selector" id="size-selector">
                            ${selectedProduct.sizes.map(s => `<button class="size-btn ${s === selectedSize ? 'active' : ''}" onclick="selectSize('${s}')">${s}</button>`).join('')}
                        </div>
                    ` : ''}
                    <div style="margin-bottom: 8px; font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;">Количество</div>
                    <div class="qty-control">
                        <button class="qty-btn" onclick="changeQty(-1)">−</button>
                        <div class="qty-value" id="qty-display">1</div>
                        <button class="qty-btn" onclick="changeQty(1)">+</button>
                    </div>
                </div>
            `;
            document.getElementById('product-modal-footer').innerHTML = `<button class="btn btn-primary" onclick="addToCartFromModal()">Добавить в корзину</button>`;
            document.getElementById('product-modal').classList.add('active');
        };

        window.selectSize = function(size) {
            selectedSize = size;
            document.querySelectorAll('#size-selector .size-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText === size);
            });
        };

        window.changeQty = function(delta) {
            selectedQty = Math.max(1, selectedQty + delta);
            document.getElementById('qty-display').innerText = selectedQty;
        };

        window.addToCartFromModal = function() {
            if (!selectedProduct) return;
            cart.push({
                productId: selectedProduct.id, name: selectedProduct.name,
                price: selectedProduct.price, size: selectedSize, qty: selectedQty,
                image: selectedProduct.images[0] || ''
            });
            updateCartBadge();
            closeModal('product-modal');
            if (window.Telegram?.WebApp?.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
            }
        };

        function updateCartBadge() {
            const badge = document.getElementById('nav-cart-badge');
            const count = cart.reduce((s, i) => s + i.qty, 0);
            if (count > 0) { badge.style.display = 'block'; badge.innerText = count; }
            else { badge.style.display = 'none'; }
        }

        window.renderCart = function() {
            const content = document.getElementById('cart-modal-content');
            const footer = document.getElementById('cart-modal-footer');
            if (cart.length === 0) {
                content.innerHTML = '<p class="empty-state">Корзина пуста</p>';
                footer.innerHTML = '';
                return;
            }
            content.innerHTML = cart.map((item, index) => `
                <div class="cart-item">
                    <img src="${item.image || 'https://via.placeholder.com/80?text=No'}">
                    <div class="info">
                        <h4>${item.name}</h4>
                        <div class="meta">${item.size ? 'Размер: ' + item.size : ''}</div>
                        <div class="price">${item.price} ₽</div>
                    </div>
                    <div class="actions">
                        <button class="remove-btn" onclick="removeFromCart(${index})">удалить</button>
                        <div class="qty-control" style="margin:0; gap: 8px;">
                            <button class="qty-btn" style="width:28px;height:28px;font-size:15px;" onclick="changeCartQty(${index}, -1)">−</button>
                            <span class="qty-value" style="font-size:13px;">${item.qty}</span>
                            <button class="qty-btn" style="width:28px;height:28px;font-size:15px;" onclick="changeCartQty(${index}, 1)">+</button>
                        </div>
                    </div>
                </div>
            `).join('');
            const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            footer.innerHTML = `
                <div style="display:flex; justify-content:space-between; margin-bottom: 14px; font-size: 16px; font-weight: 500;">
                    <span style="color: var(--text-muted);">Итого</span>
                    <span>${total} ₽</span>
                </div>
                <button class="btn btn-primary" onclick="openCheckout()">Оформить заказ</button>
            `;
        };

        window.removeFromCart = function(index) { cart.splice(index, 1); updateCartBadge(); renderCart(); };
        window.changeCartQty = function(index, delta) {
            cart[index].qty += delta;
            if (cart[index].qty <= 0) cart.splice(index, 1);
            updateCartBadge(); renderCart();
        };

        window.openCheckout = function() {
            closeModal('cart-modal');
            // Подставляем профиль
            if (currentProfile) {
                document.getElementById('customer-name').value = currentProfile.name || '';
                document.getElementById('customer-phone').value = currentProfile.phone || '';
            }
            document.getElementById('checkout-modal').classList.add('active');
        };

        window.submitOrder = async function() {
            const name = document.getElementById('customer-name').value.trim();
            const phone = document.getElementById('customer-phone').value.trim();
            const status = document.getElementById('checkout-status');
            if (!name || !phone) { status.innerText = 'Заполните имя и телефон'; return; }
            status.style.color = 'var(--text-muted)';
            status.innerText = 'Отправляем...';
            const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            const customerTelegram = tgUser ? (tgUser.username ? '@' + tgUser.username : tgUser.first_name) : null;
            const customerTelegramId = tgUser ? String(tgUser.id) : null;

            try {
                await addDoc(collection(db, "orders"), {
                    items: cart, total, customerName: name, customerPhone: phone,
                    customerTelegram, customerTelegramId,
                    meetingAddress: '', meetingTime: '',
                    status: "new", createdAt: new Date()
                });
                // Сохраняем профиль
                if (tgUser && tgUser.id) {
                    await saveProfile(name, phone);
                }
                cart = [];
                updateCartBadge();
                document.getElementById('customer-name').value = '';
                document.getElementById('customer-phone').value = '';
                status.innerText = '';
                closeModal('checkout-modal');
                document.getElementById('success-modal').classList.add('active');
                if (window.Telegram?.WebApp?.HapticFeedback) {
                    window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
                }
            } catch (e) {
                status.style.color = 'var(--danger)';
                status.innerText = 'Ошибка: ' + e.message;
            }
        };

        // ===== ПРОФИЛЬ ЭКРАН =====
        async function renderProfile() {
            const content = document.getElementById('profile-content');
            if (!tgUser || !tgUser.id) {
                content.innerHTML = '<p class="empty-state">Профиль доступен только в Telegram</p>';
                return;
            }
            if (!currentProfile) await loadProfile();

            let orders = [];
            try {
                const q = query(collection(db, "orders"), where("customerTelegramId", "==", String(tgUser.id)));
                const snap = await getDocs(q);
                snap.forEach(d => orders.push({ id: d.id, ...d.data() }));
                orders.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
            } catch (e) {
                console.error("Orders load error:", e);
            }

            const ordersHtml = orders.length === 0
                ? '<p class="empty-state">Заказов пока нет</p>'
                : orders.map(o => {
                    // Единый словарь статусов (тот же, что в админке)
const STATUSES = {
    new:        { text: 'Новый',               color: '#b85c5c' },
    accepted:   { text: 'Принято',             color: '#c98a5a' },
    processing: { text: 'Взят в обработку',    color: '#c9a05a' },
    delivery:   { text: 'В процессе доставки', color: '#6b8aa0' },
    done:       { text: 'Завершён',            color: '#6b8e6b' },
    cancelled:  { text: 'Отказ',               color: '#8a827a' }
};
let st = o.status || 'new';
if (st === 'work') st = 'processing'; // совместимость
if (!STATUSES[st]) st = 'new';
const statusText = STATUSES[st].text;
const statusColor = STATUSES[st].color;
                    const date = o.createdAt?.seconds ? new Date(o.createdAt.seconds * 1000).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
                    const itemsHtml = (o.items || []).map(i => {
                        let line = `${i.name}`;
                        if (i.size) line += ` (${i.size})`;
                        if (i.qty > 1) line += ` ×${i.qty}`;
                        return line;
                    }).join('<br>');
                    const meetingHtml = (o.meetingAddress || o.meetingTime) ? `
                        <div class="meeting-box">
                            ${o.meetingAddress ? `<div><b>Адрес:</b> ${o.meetingAddress}</div>` : ''}
                            ${o.meetingTime ? `<div><b>Время:</b> ${o.meetingTime}</div>` : ''}
                        </div>
                    ` : '';
                    return `
                        <div class="order-history-item">
                            <div class="oh-header">
                                <div class="oh-date">${date}</div>
                                <div class="oh-status" style="background:${statusColor};">${statusText}</div>
                            </div>
                            <div class="oh-items">${itemsHtml}</div>
                            <div class="oh-total">Итого: ${o.total} ₽</div>
                            ${meetingHtml}
                        </div>
                    `;
                }).join('');

            content.innerHTML = `
                <div class="profile-name">${currentProfile.name || 'Без имени'}</div>
                <div class="profile-username">${currentProfile.telegramUsername ? '@' + currentProfile.telegramUsername : (tgUser.first_name || '')}</div>
                <div class="profile-field">
                    <span class="label">Телефон</span>
                    <span class="value">${currentProfile.phone || 'не указан'}</span>
                </div>
                <button class="btn-small" style="margin-top: 12px;" onclick="openEditProfile()">Изменить имя и телефон</button>

                <div class="profile-section-title">Мои заказы</div>
                ${ordersHtml}
            `;
        }

        window.openEditProfile = function() {
            const content = document.getElementById('profile-content');
            content.innerHTML = `
                <div class="form-group">
                    <label>Имя</label>
                    <input type="text" id="edit-name" value="${currentProfile.name || ''}">
                </div>
                <div class="form-group">
                    <label>Телефон</label>
                    <input type="tel" id="edit-phone" value="${currentProfile.phone || ''}">
                </div>
                <div id="edit-status" style="color:var(--danger); font-size:13px;"></div>
                <button class="btn btn-primary" style="margin-top: 14px;" onclick="saveProfileFromForm()">Сохранить</button>
                <button class="btn-small" style="margin-top: 10px; width:100%;" onclick="renderProfile()">Отмена</button>
            `;
        };

        window.saveProfileFromForm = async function() {
            const name = document.getElementById('edit-name').value.trim();
            const phone = document.getElementById('edit-phone').value.trim();
            if (!name) { document.getElementById('edit-status').innerText = 'Введите имя'; return; }
            try {
                await saveProfile(name, phone);
                renderProfile();
            } catch (e) {
                document.getElementById('edit-status').innerText = 'Ошибка: ' + e.message;
            }
        };

        // ===== НАВИГАЦИЯ =====
        window.switchTab = function(tab) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById('nav-' + tab).classList.add('active');
            if (tab === 'catalog') {
                closeModal('profile-modal');
            } else if (tab === 'cart') {
                renderCart();
                document.getElementById('cart-modal').classList.add('active');
            } else if (tab === 'profile') {
                document.getElementById('profile-modal').classList.add('active');
                document.getElementById('profile-content').innerHTML = '<p class="empty-state">Загрузка...</p>';
                renderProfile();
            }
        };

        window.closeModal = function(id) { document.getElementById(id).classList.remove('active'); };

        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', function(e) {
                if (e.target === overlay) closeModal(overlay.id);
            });
        });

        init();
    </script>
</body>
</html>
