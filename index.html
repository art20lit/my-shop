<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог товаров</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 15px; background: #f4f4f4; }
        h1 { text-align: center; font-size: 22px; }
        .filters { display: flex; gap: 10px; margin-bottom: 15px; }
        .filters input, .filters select { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .filters input { flex: 1; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
        .card { background: white; border-radius: 8px; padding: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card .gallery { position: relative; }
        .card img { width: 100%; height: 120px; object-fit: cover; border-radius: 4px; background: #eee; }
        .card .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: white; border: none; width: 24px; height: 24px; border-radius: 50%; cursor: pointer; font-size: 12px; padding: 0; }
        .card .nav-btn.prev { left: 4px; }
        .card .nav-btn.next { right: 4px; }
        .card h3 { margin: 8px 0 4px; font-size: 15px; }
        .card p { margin: 0 0 6px; font-size: 13px; color: #666; }
        .card .category { font-size: 11px; color: #888; text-transform: uppercase; }
        .price { font-weight: bold; font-size: 15px; color: #333; margin-bottom: 6px; }
        button.add { width: 100%; padding: 8px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
        button.add:hover { background: #0056b3; }
        #cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #222; color: white; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; font-size: 15px; }
        #cart-bar button { width: auto; padding: 8px 16px; background: #28a745; border: none; color: white; border-radius: 6px; cursor: pointer; }
        body { padding-bottom: 70px; }
        #checkout-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; padding: 15px; z-index: 10; }
        #checkout-modal.active { display: flex; }
        .modal-box { background: white; border-radius: 10px; padding: 20px; width: 100%; max-width: 400px; }
        .modal-box h2 { margin-top: 0; font-size: 18px; }
        .modal-box input { width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        .modal-box .row { display: flex; gap: 10px; }
        .modal-box .row button { flex: 1; padding: 10px; border: none; border-radius: 6px; cursor: pointer; }
        .modal-box .row button.primary { background: #28a745; color: white; }
        .modal-box .row button.cancel { background: #ccc; color: #333; }
    </style>
</head>
<body>
    <h1>Наш каталог</h1>

    <div class="filters">
        <input type="text" id="search" placeholder="Поиск по названию..." oninput="applyFilters()">
        <select id="category-filter" onchange="applyFilters()">
            <option value="">Все категории</option>
        </select>
    </div>

    <div id="products" class="grid"></div>

    <div id="cart-bar" style="display:none;">
        <span>Корзина: <b id="cart-count">0</b> — <b id="cart-total">0</b> ₽</span>
        <button onclick="openCheckout()">Оформить</button>
    </div>

    <div id="checkout-modal">
        <div class="modal-box">
            <h2>Оформление заказа</h2>
            <input type="text" id="customer-name" placeholder="Ваше имя">
            <input type="tel" id="customer-phone" placeholder="Ваш телефон">
            <div class="row">
                <button class="cancel" onclick="closeCheckout()">Отмена</button>
                <button class="primary" onclick="submitOrder()">Заказать</button>
            </div>
            <div id="checkout-status" style="margin-top:10px; font-size:14px;"></div>
        </div>
    </div>

<script type="module">
    const firebaseConfig = {
        apiKey: "AIzaSyAtmwSKze_P9F_4Wkd5ZPD45bGNmDXEQ58",
        authDomain: "my-shop-22c14.firebaseapp.com",
        projectId: "my-shop-22c14",
        storageBucket: "my-shop-22c14.firebasestorage.app",
        messagingSenderId: "1029158788389",
        appId: "1:1029158788389:web:01bfc85675c52ae315cecc"
    };

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    signInAnonymously(auth).catch(e => console.error("Auth error:", e));

    let allProducts = [];
    let cart = [];
    const photoIndexes = {}; // текущий индекс фото для каждого товара

    // Загрузка
    async function loadProducts() {
        const container = document.getElementById('products');
        try {
            const snap = await getDocs(collection(db, "products"));
            allProducts = [];
            snap.forEach(doc => {
                const p = doc.data();
                // Совместимость: старые товары имели только imageUrl
                let urls = p.imageUrls;
                if (!urls || !Array.isArray(urls) || urls.length === 0) {
                    urls = p.imageUrl ? [p.imageUrl] : [];
                }
                allProducts.push({
                    id: doc.id,
                    name: p.name,
                    description: p.description || '',
                    price: p.price,
                    category: p.category || 'Без категории',
                    imageUrls: urls
                });
            });
            buildCategoryFilter();
            renderProducts();
        } catch (e) {
            container.innerHTML = '<p style="color:red;text-align:center;">Ошибка: ' + e.message + '</p>';
        }
    }

    function buildCategoryFilter() {
        const cats = [...new Set(allProducts.map(p => p.category))].sort();
        const sel = document.getElementById('category-filter');
        sel.innerHTML = '<option value="">Все категории</option>' +
            cats.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    function renderProducts() {
        const container = document.getElementById('products');
        container.innerHTML = '';
        const search = document.getElementById('search').value.toLowerCase().trim();
        const cat = document.getElementById('category-filter').value;

        const filtered = allProducts.filter(p => {
            const matchName = !search || p.name.toLowerCase().includes(search);
            const matchCat = !cat || p.category === cat;
            return matchName && matchCat;
        });

        if (filtered.length === 0) {
            container.innerHTML = '<p style="text-align:center;color:#999;grid-column:1/-1;">Ничего не найдено</p>';
            return;
        }

        filtered.forEach(p => {
            const card = document.createElement('div');
            card.className = 'card';
            const idx = photoIndexes[p.id] || 0;
            const currentImg = p.imageUrls[idx] || 'https://via.placeholder.com/200x120?text=No+image';
            const hasMultiple = p.imageUrls.length > 1;

            card.innerHTML = `
                <div class="gallery">
                    <img src="${currentImg}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/200x120?text=No+image'">
                    ${hasMultiple ? `<button class="nav-btn prev" data-id="${p.id}" data-dir="-1">‹</button>
                    <button class="nav-btn next" data-id="${p.id}" data-dir="1">›</button>` : ''}
                </div>
                <h3>${p.name}</h3>
                <div class="category">${p.category}</div>
                <p>${p.description}</p>
                <div class="price">${p.price} ₽</div>
                <button class="add" data-id="${p.id}">В корзину</button>
            `;
            card.querySelector('.add').addEventListener('click', () => addToCart(p.id, p.name, p.price));
            card.querySelectorAll('.nav-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = btn.dataset.id;
                    const dir = parseInt(btn.dataset.dir);
                    const prod = allProducts.find(x => x.id === id);
                    const cur = photoIndexes[id] || 0;
                    photoIndexes[id] = (cur + dir + prod.imageUrls.length) % prod.imageUrls.length;
                    renderProducts();
                });
            });
            container.appendChild(card);
        });
    }

    window.applyFilters = renderProducts;

    function addToCart(id, name, price) {
        cart.push({ productId: id, name, price });
        updateCartBar();
        if (window.Telegram?.WebApp?.HapticFeedback) {
            window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
        }
    }

    function updateCartBar() {
        const bar = document.getElementById('cart-bar');
        if (cart.length === 0) { bar.style.display = 'none'; return; }
        bar.style.display = 'flex';
        document.getElementById('cart-count').innerText = cart.length;
        document.getElementById('cart-total').innerText = cart.reduce((s, i) => s + i.price, 0);
    }

    window.openCheckout = () => document.getElementById('checkout-modal').classList.add('active');
    window.closeCheckout = () => {
        document.getElementById('checkout-modal').classList.remove('active');
        document.getElementById('checkout-status').innerText = '';
    };

    window.submitOrder = async function() {
        const name = document.getElementById('customer-name').value.trim();
        const phone = document.getElementById('customer-phone').value.trim();
        const status = document.getElementById('checkout-status');

        if (!name || !phone) {
            status.style.color = 'red';
            status.innerText = 'Заполните имя и телефон';
            return;
        }

        status.style.color = '#666';
        status.innerText = 'Отправляем...';

        const total = cart.reduce((s, i) => s + i.price, 0);
        const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;
        const customerTelegram = tgUser ? (tgUser.username ? '@' + tgUser.username : tgUser.first_name) : null;

        try {
            await addDoc(collection(db, "orders"), {
                items: cart,
                total: total,
                customerName: name,
                customerPhone: phone,
                customerTelegram: customerTelegram,
                status: "new",
                createdAt: new Date()
            });
            status.style.color = 'green';
            status.innerText = 'Заказ оформлен! Мы свяжемся с вами.';
            cart = [];
            updateCartBar();
            document.getElementById('customer-name').value = '';
            document.getElementById('customer-phone').value = '';
            setTimeout(() => closeCheckout(), 1500);
        } catch (e) {
            status.style.color = 'red';
            status.innerText = 'Ошибка: ' + e.message;
        }
    };

    loadProducts();
</script>
</body>
</html>
