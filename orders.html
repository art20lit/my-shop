<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказы (реальное время)</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 20px auto; padding: 15px; background: #f4f4f4; }
        h1 { font-size: 22px; }
        #login-box { text-align: center; margin-top: 100px; }
        input { padding: 10px; width: 100%; max-width: 300px; margin-bottom: 10px; box-sizing: border-box; }
        button { padding: 10px 16px; cursor: pointer; border: none; border-radius: 6px; }
        .login-btn { background: #007bff; color: white; }
        #panel { display: none; }
        .live-badge { display: inline-block; background: #28a745; color: white; padding: 4px 10px; border-radius: 12px; font-size: 12px; margin-left: 8px; vertical-align: middle; }
        .live-badge::before { content: '●'; margin-right: 4px; animation: blink 1.5s infinite; }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
        .order { background: white; border-radius: 8px; padding: 15px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-left: 4px solid #ddd; }
        .order.new-order { border-left-color: #dc3545; animation: flash 2s; }
        @keyframes flash { 0%,100% { background: white; } 50% { background: #ffe6e6; } }
        .order h3 { margin: 0 0 8px; font-size: 16px; }
        .order .meta { font-size: 13px; color: #666; margin-bottom: 8px; }
        .order .items { font-size: 14px; margin-bottom: 8px; }
        .order .total { font-weight: bold; margin-bottom: 10px; }
        .order .status-badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 12px; color: white; }
        .status-new { background: #dc3545; }
        .status-work { background: #ffc107; color: #333; }
        .status-done { background: #28a745; }
        .order .actions button { margin-right: 6px; font-size: 13px; }
        .btn-work { background: #ffc107; color: #333; }
        .btn-done { background: #28a745; color: white; }
        .filter-bar { margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .filter-bar select { padding: 8px; border-radius: 6px; border: 1px solid #ccc; }
        .enable-sound { background: #ffc107; color: #333; font-size: 13px; padding: 6px 12px; }
    </style>
</head>
<body>

<div id="login-box">
    <h1>Вход</h1>
    <input type="password" id="password" placeholder="Пароль">
    <button class="login-btn" onclick="checkPassword()">Войти</button>
    <div id="login-status" style="color:red; margin-top:10px;"></div>
</div>

<div id="panel">
    <h1>Заказы <span class="live-badge">LIVE</span></h1>
    <div class="filter-bar">
        <span>Фильтр:</span>
        <select id="status-filter" onchange="renderOrders()">
            <option value="">Все</option>
            <option value="new">Новые</option>
            <option value="work">В работе</option>
            <option value="done">Выполненные</option>
        </select>
        <button class="enable-sound" id="sound-btn" onclick="enableSound()">🔔 Включить звук</button>
    </div>
    <div id="orders"></div>
</div>

<script type="module">
    const firebaseConfig = {
        apiKey: "AIzaSyAtmwSKze_P9F_4Wkd5ZPD45bGNmDXEQ58",
        authDomain: "my-shop-22c14.firebaseapp.com",
        projectId: "my-shop-22c14",
        storageBucket: "my-shop-22c14.firebasestorage.app",
        messagingSenderId: "1029158788389",
        appId: "1:1029158788389:web:01bfc85675c52ae315cecc"
    };

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const ADMIN_PASSWORD = "arhip2026";

    let allOrders = [];
    let knownIds = new Set();
    let firstLoad = true;
    let audioCtx = null;
    let soundEnabled = false;
    let unsubscribe = null;

    window.checkPassword = function() {
        if (document.getElementById('password').value === ADMIN_PASSWORD) {
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('panel').style.display = 'block';
            localStorage.setItem('admin_ok', '1');
            startListening();
        } else {
            document.getElementById('login-status').innerText = 'Неверный пароль';
        }
    };

    if (localStorage.getItem('admin_ok') === '1') {
        document.getElementById('login-box').style.display = 'none';
        document.getElementById('panel').style.display = 'block';
        startListening();
    }

    function startListening() {
        if (unsubscribe) return; // уже слушаем
        unsubscribe = onSnapshot(collection(db, "orders"), (snap) => {
            allOrders = [];
            let newOnes = 0;
            snap.forEach(d => {
                const data = { id: d.id, ...d.data() };
                allOrders.push(data);
                if (!knownIds.has(d.id)) {
                    knownIds.add(d.id);
                    if (!firstLoad) newOnes++;
                }
            });
            allOrders.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

            if (newOnes > 0) {
                playSound();
                document.title = `(${newOnes}) Заказы`;
            } else if (firstLoad) {
                document.title = 'Заказы';
            }

            firstLoad = false;
            renderOrders(newOnes > 0 ? allOrders[0].id : null);
        }, (err) => {
            document.getElementById('orders').innerHTML = '<p style="color:red;">Ошибка: ' + err.message + '</p>';
        });
    }

    window.renderOrders = function(highlightId) {
        const filter = document.getElementById('status-filter').value;
        const container = document.getElementById('orders');
        const filtered = allOrders.filter(o => !filter || o.status === filter);

        if (filtered.length === 0) {
            container.innerHTML = '<p style="text-align:center;color:#999;">Заказов нет</p>';
            return;
        }

        container.innerHTML = '';
        filtered.forEach(o => {
            const div = document.createElement('div');
            div.className = 'order' + (o.id === highlightId ? ' new-order' : '');
            const badgeClass = o.status === 'new' ? 'status-new' : o.status === 'work' ? 'status-work' : 'status-done';
            const badgeText = o.status === 'new' ? 'Новый' : o.status === 'work' ? 'В работе' : 'Выполнен';
            const date = o.createdAt?.seconds ? new Date(o.createdAt.seconds * 1000).toLocaleString('ru-RU') : '';

            div.innerHTML = `
                <h3>${o.customerName || 'Без имени'}</h3>
                <div class="meta">${o.customerPhone || ''} ${o.customerTelegram ? '• ' + o.customerTelegram : ''} • ${date}</div>
                <div class="items">${(o.items || []).map(i => i.name + ' — ' + i.price + ' ₽').join('<br>')}</div>
                <div class="total">Итого: ${o.total} ₽</div>
                <div><span class="status-badge ${badgeClass}">${badgeText}</span></div>
                <div class="actions" style="margin-top:10px;">
                    <button class="btn-work" data-id="${o.id}" data-status="work">В работу</button>
                    <button class="btn-done" data-id="${o.id}" data-status="done">Выполнен</button>
                </div>
            `;
            div.querySelectorAll('.actions button').forEach(btn => {
                btn.addEventListener('click', async () => {
                    await updateDoc(doc(db, "orders", btn.dataset.id), { status: btn.dataset.status });
                });
            });
            container.appendChild(div);
        });
    };

    // Звук — по клику, иначе браузер блокирует автовоспроизведение
    window.enableSound = function() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        audioCtx.resume();
        soundEnabled = true;
        const btn = document.getElementById('sound-btn');
        btn.innerText = '🔔 Звук включён';
        btn.style.background = '#28a745';
        btn.style.color = 'white';
        btn.disabled = true;
        playSound(); // тестовый сигнал
    };

    function playSound() {
        if (!soundEnabled || !audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
    }
</script>
</body>
</html>
